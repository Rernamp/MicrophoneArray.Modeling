[project]
name = "microphonearray-modeling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.2.2",
    "comtypes>=1.4.17",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "marimo>=0.23.15",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyarrow>=25.0.0",
    "pycaw>=20260927",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "rnmp[widgets,video]",
    "scipy>=1.18.0",
    "soundfile>=0.14.0",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
    "wigglystuff>=0.5.32",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
rnmp = { path = "dependencies/RnmpPy", editable = true }
