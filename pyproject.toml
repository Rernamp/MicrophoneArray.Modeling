[project]
name = "microphonearray-modeling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.2.2",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "marimo>=0.23.15",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "scipy>=1.18.0",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.marimo.runtime]
pythonpath = ["src"]

[tool.pytest.ini_options]
pythonpath = "src"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
